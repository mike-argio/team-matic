<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">team-matic: Approve the batch before sending</title>
  <desc id="desc">Owner sets limits: Enable sending for one account and allowed chat IDs. Review the outbox: Inspect recipients and text. The batch ID is a SHA256 hash. Confirm that hash: Pass it to --batch and --confirm. Verify the stored message. The owner approves the exact plan unless agent_may_send is true. Selected chat only unless --allow-navigation or policy allow_navigation permits switching. COMPOSE_BLOCKED_BY_TEAMS leaves that job pending; others can proceed. Never retry attempting or uncertain jobs without reconciliation.</desc>
  <rect width="1000" height="390" rx="16" fill="#11333b"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="26" y="32" font-size="16" font-weight="700" fill="#9ce2d5">team-matic   /   03   /   SEND</text>
    <text x="26" y="76" font-size="34" font-weight="700" fill="#fff9e9">Approve the batch before sending</text>
    <rect x="26" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="42" y="125" font-size="15" font-weight="700" fill="#326760">POLICY</text>
    <text x="42" y="159" font-size="25" font-weight="700" fill="#11333b">Owner sets limits</text>
    <text x="42" y="189" font-size="17" font-weight="400" fill="#334f54">Enable sending for one</text>
    <text x="42" y="212" font-size="17" font-weight="400" fill="#334f54">account and allowed chat IDs.</text>
    <path d="M328 164h18m-6 -6 6 6-6 6" fill="none" stroke="#9ce2d5" stroke-width="2"/>
    <rect x="350" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="366" y="125" font-size="15" font-weight="700" fill="#326760">PLAN OFFLINE</text>
    <text x="366" y="159" font-size="25" font-weight="700" fill="#11333b">Review the outbox</text>
    <text x="366" y="189" font-size="17" font-weight="400" fill="#334f54">Inspect recipients and text.</text>
    <text x="366" y="212" font-size="17" font-weight="400" fill="#334f54">The batch ID is a SHA256 hash.</text>
    <path d="M652 164h18m-6 -6 6 6-6 6" fill="none" stroke="#9ce2d5" stroke-width="2"/>
    <rect x="674" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="690" y="125" font-size="15" font-weight="700" fill="#326760">RUN LIVE</text>
    <text x="690" y="159" font-size="25" font-weight="700" fill="#11333b">Confirm that hash</text>
    <text x="690" y="189" font-size="17" font-weight="400" fill="#334f54">Pass it to --batch and --confirm.</text>
    <text x="690" y="212" font-size="17" font-weight="400" fill="#334f54">Verify the stored message.</text>
    <text x="26" y="264" font-size="17" font-weight="700" fill="#9ce2d5">Approval</text>
    <text x="158" y="264" font-size="17" font-weight="400" fill="#fff9e9">The owner approves the exact plan unless agent_may_send is true.</text>
    <text x="26" y="298" font-size="17" font-weight="700" fill="#9ce2d5">Navigation</text>
    <text x="158" y="298" font-size="17" font-weight="400" fill="#fff9e9">Selected chat only unless --allow-navigation or policy allow_navigation permits switching.</text>
    <text x="26" y="332" font-size="17" font-weight="700" fill="#9ce2d5">Teams block</text>
    <text x="158" y="332" font-size="17" font-weight="400" fill="#fff9e9">COMPOSE_BLOCKED_BY_TEAMS leaves that job pending; others can proceed.</text>
    <text x="26" y="366" font-size="17" font-weight="700" fill="#9ce2d5">Recovery</text>
    <text x="158" y="366" font-size="17" font-weight="400" fill="#fff9e9">Never retry attempting or uncertain jobs without reconciliation.</text>
  </g>
</svg>
