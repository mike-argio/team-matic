<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="322" viewBox="0 0 1000 322" role="img" aria-labelledby="title desc">
  <title id="title">team-matic: Read live without saving messages</title>
  <desc id="desc">cdp open: With owner permission, open the local debug port. list / read: List loaded chats, then read by stable chat_id. cdp close: Close the debug port when the work is done. Live reads use memory; no message copy is written to disk. Run sync while connected. Later, read that copy with --offline.</desc>
  <rect width="1000" height="322" rx="16" fill="#11333b"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="26" y="32" font-size="16" font-weight="700" fill="#9ce2d5">team-matic   /   02   /   READ</text>
    <text x="26" y="76" font-size="34" font-weight="700" fill="#fff9e9">Read live without saving messages</text>
    <rect x="26" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="42" y="125" font-size="15" font-weight="700" fill="#326760">OPEN</text>
    <text x="42" y="159" font-size="25" font-weight="700" fill="#11333b">cdp open</text>
    <text x="42" y="189" font-size="17" font-weight="400" fill="#334f54">With owner permission,</text>
    <text x="42" y="212" font-size="17" font-weight="400" fill="#334f54">open the local debug port.</text>
    <path d="M328 164h18m-6 -6 6 6-6 6" fill="none" stroke="#9ce2d5" stroke-width="2"/>
    <rect x="350" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="366" y="125" font-size="15" font-weight="700" fill="#326760">INSPECT</text>
    <text x="366" y="159" font-size="25" font-weight="700" fill="#11333b">list / read</text>
    <text x="366" y="189" font-size="17" font-weight="400" fill="#334f54">List loaded chats, then</text>
    <text x="366" y="212" font-size="17" font-weight="400" fill="#334f54">read by stable chat_id.</text>
    <path d="M652 164h18m-6 -6 6 6-6 6" fill="none" stroke="#9ce2d5" stroke-width="2"/>
    <rect x="674" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="690" y="125" font-size="15" font-weight="700" fill="#326760">CLOSE</text>
    <text x="690" y="159" font-size="25" font-weight="700" fill="#11333b">cdp close</text>
    <text x="690" y="189" font-size="17" font-weight="400" fill="#334f54">Close the debug port</text>
    <text x="690" y="212" font-size="17" font-weight="400" fill="#334f54">when the work is done.</text>
    <text x="26" y="264" font-size="17" font-weight="700" fill="#9ce2d5">Default</text>
    <text x="158" y="264" font-size="17" font-weight="400" fill="#fff9e9">Live reads use memory; no message copy is written to disk.</text>
    <text x="26" y="298" font-size="17" font-weight="700" fill="#9ce2d5">Opt-in copy</text>
    <text x="158" y="298" font-size="17" font-weight="400" fill="#fff9e9">Run sync while connected. Later, read that copy with --offline.</text>
  </g>
</svg>
