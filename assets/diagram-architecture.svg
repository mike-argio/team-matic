<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="322" viewBox="0 0 1000 322" role="img" aria-labelledby="title desc">
  <title id="title">team-matic: One bridge to the signed-in client</title>
  <desc id="desc">Script or AI agent: Choose a command. Use IDs, not chat names. team-matic CLI: Run locally on Windows. Return structured JSON. Teams desktop: Connect via local CDP with owner permission. Only chats and messages already loaded in the client are visible. No Graph API, Azure app registration or hosted relay.</desc>
  <rect width="1000" height="322" rx="16" fill="#11333b"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="26" y="32" font-size="16" font-weight="700" fill="#9ce2d5">team-matic   /   01   /   ARCHITECTURE</text>
    <text x="26" y="76" font-size="34" font-weight="700" fill="#fff9e9">One bridge to the signed-in client</text>
    <rect x="26" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="42" y="125" font-size="15" font-weight="700" fill="#326760">CALLER</text>
    <text x="42" y="159" font-size="25" font-weight="700" fill="#11333b">Script or AI agent</text>
    <text x="42" y="189" font-size="17" font-weight="400" fill="#334f54">Choose a command.</text>
    <text x="42" y="212" font-size="17" font-weight="400" fill="#334f54">Use IDs, not chat names.</text>
    <path d="M328 164h18m-6 -6 6 6-6 6" fill="none" stroke="#9ce2d5" stroke-width="2"/>
    <rect x="350" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="366" y="125" font-size="15" font-weight="700" fill="#326760">INTERFACE</text>
    <text x="366" y="159" font-size="25" font-weight="700" fill="#11333b">team-matic CLI</text>
    <text x="366" y="189" font-size="17" font-weight="400" fill="#334f54">Run locally on Windows.</text>
    <text x="366" y="212" font-size="17" font-weight="400" fill="#334f54">Return structured JSON.</text>
    <path d="M652 164h18m-6 -6 6 6-6 6" fill="none" stroke="#9ce2d5" stroke-width="2"/>
    <rect x="674" y="98" width="300" height="132" rx="12" fill="#f8f5e9"/>
    <text x="690" y="125" font-size="15" font-weight="700" fill="#326760">CONNECTION</text>
    <text x="690" y="159" font-size="25" font-weight="700" fill="#11333b">Teams desktop</text>
    <text x="690" y="189" font-size="17" font-weight="400" fill="#334f54">Connect via local CDP</text>
    <text x="690" y="212" font-size="17" font-weight="400" fill="#334f54">with owner permission.</text>
    <text x="26" y="264" font-size="17" font-weight="700" fill="#9ce2d5">Read scope</text>
    <text x="158" y="264" font-size="17" font-weight="400" fill="#fff9e9">Only chats and messages already loaded in the client are visible.</text>
    <text x="26" y="298" font-size="17" font-weight="700" fill="#9ce2d5">Local only</text>
    <text x="158" y="298" font-size="17" font-weight="400" fill="#fff9e9">No Graph API, Azure app registration or hosted relay.</text>
  </g>
</svg>
